<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>PickleBall Dating — Find Your Perfect Match on the Court</title>
    <meta name="description" content="Find pickleball partners matched to your skill level. Book courts nearby, chat with players, and never play alone again. Free for iOS, Android & Web." />
    <meta name="keywords" content="pickleball, find players, book courts, pickleball matching, skill level, pickleball community, pickleball app" />
    <meta name="author" content="PickleBall Dating" />
    <meta name="theme-color" content="#3B5998" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PickleMatch — Find Your Perfect Pickleball Partner" />
    <meta property="og:description" content="Match by skill level. Book courts nearby. Chat with players. Never play alone again." />
    <meta property="og:site_name" content="PickleBall Dating" />
    <meta property="og:url" content="https://pickleball-dating.vercel.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PickleMatch — Find Your Perfect Pickleball Partner" />
    <meta name="twitter:description" content="Match by skill level. Book courts nearby. Chat with players. Never play alone again." />

    <!-- Accessibility & SEO -->
    <link rel="canonical" href="https://pickleball-dating.vercel.app" />

    <!-- Dark mode support: prevent flash of wrong color -->
    <style>
      body { margin: 0; background-color: #FAF9F7; transition: background-color 0.2s; }
      @media (prefers-color-scheme: dark) {
        body { background-color: #121212; }
        meta[name="theme-color"] { content: #121212; }
      }
      #root { min-height: 100vh; }
    </style>

    <!-- Fix font preload crossorigin mismatch (Expo-generated preload tags may lack crossorigin) -->
    <script>
      // Remove font preload links that lack crossorigin to prevent CORS warnings
      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('link[rel="preload"][as="font"]').forEach(function (link) {
          if (!link.getAttribute('crossorigin')) {
            link.setAttribute('crossorigin', 'anonymous');
          }
        });
      });
    </script>
  </head>

  <body>
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:system-ui,sans-serif">
        <h1>PickleBall Dating</h1>
        <p>Find your perfect match on the court. Connect with pickleball players near you.</p>
        <p>Please enable JavaScript to use this app.</p>
      </div>
    </noscript>
    <div id="root" role="application" aria-label="PickleBall Dating App"></div>
  </body>
</html>
